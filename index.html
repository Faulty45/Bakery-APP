<!DOCTYPE html>
<html>
<head>
  <title>Bakery POS</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .hidden { display: none; }
    button { margin: 5px; }
    table { border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 5px; }
    input { margin: 5px; }
  </style>
</head>
<body>

<h2>Bakery POS Login</h2>

<div id="loginScreen">
  <input id="pinInput" type="password" placeholder="Enter PIN">
  <button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">

<h3 id="welcome"></h3>
<button onclick="logout()">Logout</button>

<!-- EMPLOYEE VIEW -->
<div id="employeePanel" class="hidden">
  <h3>Sales</h3>

  <select id="itemSelect">
    <option value="Bread">Bread - $3</option>
    <option value="Croissant">Croissant - $2</option>
    <option value="Cake Slice">Cake Slice - $5</option>
  </select>

  <button onclick="sellItem()">Sell Item</button>
</div>

<!-- MANAGER VIEW -->
<div id="managerPanel" class="hidden">

<h3>Manager Dashboard</h3>

<h4>Employee Management</h4>
<input id="empName" placeholder="Employee Name">
<input id="empPin" placeholder="4-digit PIN">
<button onclick="addEmployee()">Add Employee</button>

<table id="employeeTable"></table>

<h4>Change Manager PIN</h4>
<input id="newManagerPin" placeholder="New 4-digit PIN">
<button onclick="changeManagerPin()">Update PIN</button>

<h4>Employee Activity Log</h4>
<button onclick="viewLogs()">View Logs</button>
<div id="logOutput"></div>

<h4>Reset Locked Accounts</h4>
<button onclick="resetLocks()">Unlock All</button>

</div>
</div>

<script>
let managerPin = localStorage.getItem("managerPin") || "0000";
let employees = JSON.parse(localStorage.getItem("employees")) || {};
let failedAttempts = JSON.parse(localStorage.getItem("failedAttempts")) || {};
let activityLog = JSON.parse(localStorage.getItem("activityLog")) || [];

let currentUser = "";

function save() {
  localStorage.setItem("employees", JSON.stringify(employees));
  localStorage.setItem("managerPin", managerPin);
  localStorage.setItem("failedAttempts", JSON.stringify(failedAttempts));
  localStorage.setItem("activityLog", JSON.stringify(activityLog));
}

function login() {
  const pin = pinInput.value;

  if (failedAttempts[pin] >= 3)
    return alert("Account locked. Contact manager.");

  if (pin === managerPin) {
    currentUser = "Manager";
    openApp(true);
    return;
  }

  if (!employees[pin]) {
    failedAttempts[pin] = (failedAttempts[pin] || 0) + 1;
    save();
    return alert("Invalid PIN");
  }

  failedAttempts[pin] = 0;
  currentUser = employees[pin];
  save();
  openApp(false);
}

function openApp(isManager) {
  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");
  welcome.innerText = "Welcome " + currentUser;
  pinInput.value = "";

  employeePanel.classList.toggle("hidden", isManager);
  managerPanel.classList.toggle("hidden", !isManager);

  logAction("Logged in");

  if (isManager) renderEmployees();
}

function logout() {
  logAction("Logged out");
  location.reload();
}

function addEmployee() {
  if (empPin.value.length !== 4)
    return alert("PIN must be 4 digits");

  if (employees[empPin.value])
    return alert("PIN already exists");

  employees[empPin.value] = empName.value;
  save();
  renderEmployees();
  empName.value = empPin.value = "";
}

function deleteEmployee(pin) {
  if (!confirm("Delete employee?")) return;
  delete employees[pin];
  save();
  renderEmployees();
}

function editEmployee(pin, name) {
  employees[pin] = name;
  save();
}

function renderEmployees() {
  employeeTable.innerHTML =
    "<tr><th>Name</th><th>PIN</th><th>Action</th></tr>";

  for (let pin in employees) {
    employeeTable.innerHTML += `
      <tr>
        <td><input value="${employees[pin]}"
            onchange="editEmployee('${pin}', this.value)"></td>
        <td>${pin}</td>
        <td><button onclick="deleteEmployee('${pin}')">Delete</button></td>
      </tr>`;
  }
}

function sellItem() {
  const item = itemSelect.value;
  logAction("Sold " + item);
  alert(item + " sold");
}

function logAction(action) {
  activityLog.push({
    user: currentUser,
    action,
    time: new Date().toLocaleString()
  });
  save();
}

function viewLogs() {
  logOutput.innerHTML = activityLog
    .slice(-50)
    .map(l => `<p>[${l.time}] ${l.user}: ${l.action}</p>`)
    .join("");
}

function changeManagerPin() {
  if (newManagerPin.value.length !== 4)
    return alert("PIN must be 4 digits");

  managerPin = newManagerPin.value;
  save();
  alert("Manager PIN updated");
  newManagerPin.value = "";
}

function resetLocks() {
  failedAttempts = {};
  save();
  alert("All accounts unlocked");
}
</script>

</body>
</html>
