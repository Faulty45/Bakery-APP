<!DOCTYPE html>
<html>
<head>
<title>Bakery POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #fff7ed;
  padding: 20px;
  color: #4b2e1e;
}
h2,h3,h4 { color:#8b4513; }
.card {
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:20px;
  box-shadow:0 6px 15px rgba(0,0,0,.1);
}
button {
  background:#d2691e;
  color:#fff;
  border:none;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}
button:hover { background:#b45309; }
input,select {
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ccc;
  width:100%;
}
.hidden{display:none;}
table{width:100%;border-collapse:collapse;}
th,td{padding:8px;border-bottom:1px solid #eee;}
.roleBtn{width:100%;margin-top:8px;}
.notice{
  background:#fde68a;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}
@media print {
  button,input,select { display:none; }
}
</style>
</head>

<body>

<h2>🍞 Bakery POS</h2>

<div class="card notice">
<b>First Login</b><br>
Manager PIN: <b>0000</b><br>
Manager Name: <b>Owner</b>
</div>

<div id="loginScreen" class="card">
  <input id="pinInput" type="password" placeholder="Enter PIN">
  <button class="roleBtn" onclick="login('sales')">Employee Sales Login</button>
  <button class="roleBtn" onclick="login('production')">Employee Production Login</button>
  <button class="roleBtn" onclick="login('manager')">Manager Login</button>
</div>

<div id="app" class="hidden">
<h3 id="welcome"></h3>
<button onclick="logout()">Logout</button>

<!-- SALES -->
<div id="salesPanel" class="card hidden">
<h4>Sell Items</h4>
<select id="sellItemSelect"></select>
<button onclick="sellItem()">Sell</button>
</div>

<!-- PRODUCTION -->
<div id="productionPanel" class="card hidden">
<h4>Add Produced Items</h4>
<select id="prodItemSelect"></select>
<input id="prodQty" type="number" placeholder="Quantity">
<button onclick="addProduction()">Add Production</button>
</div>

<!-- MANAGER -->
<div id="managerPanel" class="card hidden">

<h3>Manager Dashboard</h3>

<h4>Items, Prices & Inventory</h4>
<input id="itemName" placeholder="Item name">
<input id="itemPrice" type="number" placeholder="Price">
<input id="itemStock" type="number" placeholder="Starting inventory">
<button onclick="addOrUpdateItem()">Save Item</button>

<table id="itemTable"></table>

<h4>Employees</h4>
<input id="empName" placeholder="Employee name">
<input id="empPin" placeholder="4-digit PIN">
<button onclick="addEmployee()">Add Employee</button>

<h4>Managers</h4>
<input id="mgrName" placeholder="Manager name">
<input id="mgrPin" placeholder="4-digit PIN">
<button onclick="addManager()">Add Manager</button>

<table id="userTable"></table>

<h4>Reports</h4>
<button onclick="printReport('day')">Daily Report</button>
<button onclick="printReport('week')">Weekly Report</button>
<button onclick="printReport('month')">Monthly Report</button>

<h4>Activity Log</h4>
<div id="logOutput"></div>

</div>
</div>

<script>
// ---------- DATA ----------
let managers = JSON.parse(localStorage.getItem("managers"));
if (!managers || managers.length===0)
  managers=[{name:"Owner",pin:"0000"}];

let employees = JSON.parse(localStorage.getItem("employees")) || {};
let items = JSON.parse(localStorage.getItem("items")) || {};
let activityLog = JSON.parse(localStorage.getItem("activityLog")) || [];

let currentUser="", currentRole="";

// ---------- SAVE ----------
function save(){
  localStorage.setItem("managers",JSON.stringify(managers));
  localStorage.setItem("employees",JSON.stringify(employees));
  localStorage.setItem("items",JSON.stringify(items));
  localStorage.setItem("activityLog",JSON.stringify(activityLog));
}

// ---------- LOGIN ----------
function login(role){
  const pin=pinInput.value;
  const manager=managers.find(m=>m.pin===pin);
  if(role==="manager" && manager){
    currentUser=manager.name;
    currentRole="manager";
    openApp(); return;
  }
  if(!employees[pin]) return alert("Invalid PIN");
  currentUser=employees[pin];
  currentRole=role;
  openApp();
}

// ---------- OPEN ----------
function openApp(){
  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");
  welcome.innerText=`Welcome ${currentUser} (${currentRole})`;

  salesPanel.classList.toggle("hidden",currentRole!=="sales");
  productionPanel.classList.toggle("hidden",currentRole!=="production");
  managerPanel.classList.toggle("hidden",currentRole!=="manager");

  renderItems(); renderUsers();
  logAction("Logged in");
}

// ---------- LOGOUT ----------
function logout(){ location.reload(); }

// ---------- ITEMS ----------
function renderItems(){
  sellItemSelect.innerHTML="";
  prodItemSelect.innerHTML="";
  itemTable.innerHTML="<tr><th>Item</th><th>Price</th><th>Stock</th></tr>";

  for(let i in items){
    sellItemSelect.innerHTML+=`<option>${i}</option>`;
    prodItemSelect.innerHTML+=`<option>${i}</option>`;
    itemTable.innerHTML+=`
    <tr>
      <td>${i}</td>
      <td><input value="${items[i].price}" onchange="items['${i}'].price=this.value;save()"></td>
      <td>${items[i].stock}</td>
    </tr>`;
  }
}

function addOrUpdateItem(){
  items[itemName.value]={
    price:Number(itemPrice.value),
    stock:Number(itemStock.value||0)
  };
  save(); renderItems();
  logAction("Updated item "+itemName.value);
  itemName.value=itemPrice.value=itemStock.value="";
}

// ---------- SALES ----------
function sellItem(){
  const item=sellItemSelect.value;
  if(items[item].stock<=0) return alert("Out of stock");
  items[item].stock--;
  save(); renderItems();
  logAction("Sold "+item);
}

// ---------- PRODUCTION ----------
function addProduction(){
  const item=prodItemSelect.value;
  items[item].stock+=Number(prodQty.value);
  save(); renderItems();
  logAction("Produced "+prodQty.value+" "+item);
  prodQty.value="";
}

// ---------- USERS ----------
function addEmployee(){
  employees[empPin.value]=empName.value;
  save(); renderUsers();
}

function addManager(){
  managers.push({name:mgrName.value,pin:mgrPin.value});
  save(); renderUsers();
}

function renderUsers(){
  userTable.innerHTML="<tr><th>Name</th><th>PIN</th><th>Role</th></tr>";
  for(let p in employees)
    userTable.innerHTML+=`<tr><td>${employees[p]}</td><td>${p}</td><td>Employee</td></tr>`;
  managers.forEach(m=>
    userTable.innerHTML+=`<tr><td>${m.name}</td><td>${m.pin}</td><td>Manager</td></tr>`);
}

// ---------- LOGS ----------
function logAction(action){
  activityLog.push({user:currentUser,action,time:new Date()});
  save();
}

function printReport(type){
  const now=new Date();
  const filtered=activityLog.filter(l=>{
    const t=new Date(l.time);
    if(type==="day") return t.toDateString()===now.toDateString();
    if(type==="week") return now-t<7*86400000;
    if(type==="month") return t.getMonth()===now.getMonth();
  });
  logOutput.innerHTML=filtered.map(l=>
    `<p>${new Date(l.time).toLocaleString()} — ${l.user}: ${l.action}</p>`).join("");
  window.print();
}
</script>

</body>
</html>
