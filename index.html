<!DOCTYPE html>
<html>
<head>
  <title>Bakery Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial; margin:0; background:#f6e8d7; }
    header { background:#8b5a2b; color:#fff; padding:16px; font-size:20px; }
    .container { padding:16px; }
    .card { background:#fff; padding:16px; border-radius:8px; margin-bottom:12px; }
    input, button { width:100%; padding:12px; font-size:16px; margin-top:8px; }
    button { background:#8b5a2b; color:#fff; border:none; border-radius:6px; }
    ul { padding-left:18px; }
  </style>
</head>
<body>

<header>🍞 Bakery Manager</header>

<div class="container">

  <div class="card">
    <h3>Produce Item</h3>
    <input id="produceName" placeholder="Item name">
    <input id="produceQty" type="number" placeholder="Quantity produced">
    <button onclick="produce()">Add to Inventory</button>
  </div>

  <div class="card">
    <h3>Sell Item</h3>
    <input id="sellName" placeholder="Item name">
    <input id="sellQty" type="number" placeholder="Quantity sold">
    <button onclick="sell()">Record Sale</button>
  </div>

  <div class="card">
    <h3>Current Inventory</h3>
    <ul id="inventoryList"></ul>
  </div>

</div>

<script>
let inventory = JSON.parse(localStorage.getItem("inventory")) || {};

function save() {
  localStorage.setItem("inventory", JSON.stringify(inventory));
  render();
}

function produce() {
  const name = produceName.value.trim();
  const qty = Number(produceQty.value);
  if (!name || qty <= 0) return alert("Enter valid values");

  inventory[name] = (inventory[name] || 0) + qty;
  save();
  produceName.value = "";
  produceQty.value = "";
}

function sell() {
  const name = sellName.value.trim();
  const qty = Number(sellQty.value);
  if (!inventory[name] || qty <= 0) return alert("Invalid sale");

  inventory[name] -= qty;
  if (inventory[name] <= 0) delete inventory[name];
  save();
  sellName.value = "";
  sellQty.value = "";
}

function render() {
  inventoryList.innerHTML = "";
  for (let item in inventory) {
    inventoryList.innerHTML += `<li>${item}: ${inventory[item]}</li>`;
  }
}

render();
</script>

</body>
</html>
