<!DOCTYPE html>
<html>
<head>
  <title>Bakery Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; margin:0; background:#f6e8d7; }
    header { background:#8b5a2b; color:#fff; padding:16px; font-size:20px; }
    .container { padding:16px; }
    .card { background:#fff; padding:16px; border-radius:8px; margin-bottom:12px; }
    input, select, button {
      width:100%; padding:12px; font-size:16px; margin-top:8px;
    }
    button { background:#8b5a2b; color:#fff; border:none; border-radius:6px; }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; text-align:left; }
    .hidden { display:none; }
    .manager { background:#f0d9b5; }
  </style>
</head>
<body>

<header>🍞 Bakery Manager</header>

<div class="container">

<!-- LOGIN -->
<div id="loginCard" class="card">
  <h3>Login</h3>
  <input id="pinInput" type="password" placeholder="Enter PIN">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- MANAGER SETTINGS -->
  <div id="managerPanel" class="card manager hidden">
    <h3>Manager Settings</h3>

    <h4>Add Employee</h4>
    <input id="empName" placeholder="Employee name">
    <input id="empPin" placeholder="4-digit PIN">
    <button onclick="addEmployee()">Add Employee</button>

    <h4>Add Item</h4>
    <input id="itemName" placeholder="Item name">
    <input id="itemPrice" type="number" step="0.01" placeholder="Price">
    <button onclick="addItem()">Save Item</button>

    <h4>Reports</h4>
    <select id="reportType">
      <option value="day">Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
    </select>
    <button onclick="generateReport()">Generate Report</button>
    <button onclick="window.print()">Print Report</button>
  </div>

  <!-- SALES -->
  <div class="card">
    <h3>Sell Item</h3>
    <select id="sellItem"></select>
    <input id="sellQty" type="number" placeholder="Quantity">
    <button onclick="sell()">Record Sale</button>
  </div>

  <!-- REPORT OUTPUT -->
  <div id="reportCard" class="card hidden">
    <h3>Sales Report</h3>
    <table id="reportTable"></table>
  </div>

  <button onclick="logout()">Logout</button>
</div>

</div>

<script>
const MANAGER_PIN = "9999";

let employees = JSON.parse(localStorage.getItem("employees")) || {};
let items = JSON.parse(localStorage.getItem("items")) || {};
let sales = JSON.parse(localStorage.getItem("sales")) || [];
let currentUser = null;
let isManager = false;

function save() {
  localStorage.setItem("employees", JSON.stringify(employees));
  localStorage.setItem("items", JSON.stringify(items));
  localStorage.setItem("sales", JSON.stringify(sales));
}

function login() {
  const pin = pinInput.value;
  if (pin === MANAGER_PIN) {
    isManager = true;
    currentUser = "Manager";
  } else if (employees[pin]) {
    isManager = false;
    currentUser = employees[pin];
  } else {
    return alert("Invalid PIN");
  }

  loginCard.classList.add("hidden");
  app.classList.remove("hidden");
  if (isManager) managerPanel.classList.remove("hidden");
  loadItems();
}

function logout() {
  currentUser = null;
  isManager = false;
  app.classList.add("hidden");
  managerPanel.classList.add("hidden");
  loginCard.classList.remove("hidden");
}

function addEmployee() {
  if (empPin.value.length !== 4) return alert("PIN must be 4 digits");
  employees[empPin.value] = empName.value;
  save();
  empName.value = empPin.value = "";
}

function addItem() {
  items[itemName.value] = Number(itemPrice.value);
  save();
  loadItems();
  itemName.value = itemPrice.value = "";
}

function loadItems() {
  sellItem.innerHTML = "";
  for (let item in items) {
    sellItem.innerHTML += `<option>${item}</option>`;
  }
}

function sell() {
  const qty = Number(sellQty.value);
  const item = sellItem.value;
  const amount = qty * items[item];
  if (!qty || !item) return;

  sales.push({
    date: new Date().toISOString(),
    item,
    qty,
    amount,
    employee: currentUser
  });

  save();
  sellQty.value = "";
}

function generateReport() {
  const type = reportType.value;
  const now = new Date();
  let filtered = sales.filter(s => {
    const d = new Date(s.date);
    if (type === "day") return d.toDateString() === now.toDateString();
    if (type === "week") return d > new Date(now - 7*86400000);
    if (type === "month") return d.getMonth() === now.getMonth();
  });

  let total = 0;
  reportTable.innerHTML =
    "<tr><th>Date</th><th>Item</th><th>Qty</th><th>Employee</th><th>Amount</th></tr>";

  filtered.forEach(s => {
    total += s.amount;
    reportTable.innerHTML +=
      `<tr>
        <td>${new Date(s.date).toLocaleString()}</td>
        <td>${s.item}</td>
        <td>${s.qty}</td>
        <td>${s.employee}</td>
        <td>$${s.amount.toFixed(2)}</td>
      </tr>`;
  });

  reportTable.innerHTML +=
    `<tr><td colspan="4"><strong>Total</strong></td><td><strong>$${total.toFixed(2)}</strong></td></tr>`;

  reportCard.classList.remove("hidden");
}
</script>

</body>
</html>
