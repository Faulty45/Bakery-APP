<!DOCTYPE html>
<html>
<head>
  <title>Bakery Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f6e8d7;
    }
    header {
      background: #8b5a2b;
      color: white;
      padding: 16px;
      font-size: 20px;
    }
    .container {
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: #8b5a2b;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 8px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<header>🍞 Bakery Manager</header>

<div class="container">

  <div class="card">
    <h3>Produce Item</h3>
    <input placeholder="Item name">
    <input placeholder="Quantity produced" type="number">
    <button>Add to Inventory</button>
  </div>

  <div class="card">
    <h3>Sell Item</h3>
    <input placeholder="Item name">
    <input placeholder="Quantity sold" type="number">
    <button>Record Sale</button>
  </div>

  <div class="card">
    <h3>Daily Summary</h3>
    <p>Inventory, sales, and money totals will appear here.</p>
  </div>

</div>

</body>
</html>
