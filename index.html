<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bakery POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Segoe UI;background:#fff7ed;padding:20px;color:#4b2e1e}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:20px;box-shadow:0 6px 15px rgba(0,0,0,.1)}
button{background:#d2691e;color:#fff;border:none;padding:8px 14px;border-radius:10px;cursor:pointer}
button:hover{background:#b45309}
input,select{padding:6px;border-radius:8px;border:1px solid #ccc}
.hidden{display:none}
.itemRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qtyBtn{width:36px;font-size:18px}
.totalBox{font-size:20px;font-weight:bold;text-align:right}
#receipt{width:280px;font-family:monospace;background:#fff;padding:10px}
@media print{button,input,select{display:none}}
</style>
</head>

<body>

<h2>🍞 Bakery POS</h2>

<div id="login" class="card">
<input id="pin" type="password" placeholder="Enter PIN"><br><br>
<button onclick="loginUser('sales')">Sales</button>
<button onclick="loginUser('production')">Production</button>
<button onclick="loginUser('manager')">Manager</button>
</div>

<div id="app" class="hidden">

<h3 id="welcome"></h3>
<button onclick="location.reload()">Logout</button>

<!-- SALES -->
<div id="sales" class="card hidden">
<h4>Sales</h4>
<div id="itemsUI"></div>

<h4>Tip</h4>
<input id="tip" type="number" value="0" oninput="updateTotal()">

<h4>Discount</h4>
<select id="discType">
<option value="">None</option>
<option value="percent">%</option>
<option value="fixed">$</option>
</select>
<input id="discVal" type="number">
<button onclick="applyDiscount()">Apply</button>

<h4>Tax (7%)</h4>
$<span id="taxDisplay">0.00</span>

<div class="totalBox">Total: $<span id="total">0.00</span></div>

<h4>Payment</h4>
<button onclick="payType='cash'">Cash</button>
<button onclick="payType='card'">Card</button>
<button onclick="payType='split'">Split</button><br><br>

<input id="cashGiven" type="number" placeholder="Cash Given">
<input id="cashPart" type="number" placeholder="Cash Part">
<input id="cardPart" type="number" placeholder="Card Part">

<br><br>
<button onclick="completeSale()">Pay & Print</button>
</div>

<!-- PRODUCTION -->
<div id="production" class="card hidden">
<h4>Add Production</h4>
<select id="prodItem"></select>
<input id="prodQty" type="number">
<button onclick="addProduction()">Add</button>
</div>

<!-- MANAGER -->
<div id="manager" class="card hidden">
<h3>Manager Dashboard</h3>

<h4>Items</h4>
<input id="itemName" placeholder="Name">
<input id="itemPrice" type="number" placeholder="Price">
<input id="itemStock" type="number" placeholder="Stock">
<label><input type="checkbox" id="itemTax" checked> Taxable</label>
<button onclick="saveItem()">Save</button>

<h4>Employees</h4>
<input id="empName" placeholder="Name">
<input id="empPin" placeholder="PIN">
<button onclick="addEmployee()">Add</button>

<h4>Managers</h4>
<input id="mgrName" placeholder="Name">
<input id="mgrPin" placeholder="PIN">
<button onclick="addManager()">Add</button>

<h4>Reports</h4>
<button onclick="taxReport()">End-of-Day Tax Report</button>

<div id="report"></div>
</div>

</div>

<div id="receipt" class="hidden"></div>

<script>
const TAX_RATE=0.07;
let discount=0,payType="",tax=0,cart={};

let managers=JSON.parse(localStorage.getItem("managers"))||[{name:"Owner",pin:"0000"}];
let employees=JSON.parse(localStorage.getItem("employees"))||{};
let items=JSON.parse(localStorage.getItem("items"))||{};
let taxLedger=JSON.parse(localStorage.getItem("taxLedger"))||[];

function save(){localStorage.setItem("managers",JSON.stringify(managers));
localStorage.setItem("employees",JSON.stringify(employees));
localStorage.setItem("items",JSON.stringify(items));
localStorage.setItem("taxLedger",JSON.stringify(taxLedger));}

function loginUser(role){
const p=pin.value;
if(role==="manager"){
const m=managers.find(x=>x.pin===p);if(!m)return alert("Invalid");
welcome.innerText="Welcome "+m.name;show(role);return;}
if(!employees[p])return alert("Invalid");
welcome.innerText="Welcome "+employees[p];show(role);}

function show(role){
login.classList.add("hidden");app.classList.remove("hidden");
sales.classList.toggle("hidden",role!=="sales");
production.classList.toggle("hidden",role!=="production");
manager.classList.toggle("hidden",role!=="manager");
renderSales();renderProduction();}

function renderSales(){
itemsUI.innerHTML="";cart={};discount=0;
for(let i in items){
itemsUI.innerHTML+=`
<div class="itemRow">
${i} $${items[i].price} (${items[i].stock})
<button class="qtyBtn" onclick="qty('${i}',1)">+</button>
<button class="qtyBtn" onclick="qty('${i}',-1)">-</button>
<span id="q-${i}">0</span>
</div>`;}
updateTotal();}

function qty(i,d){
cart[i]=(cart[i]||0)+d;
if(cart[i]<0)cart[i]=0;
if(cart[i]>items[i].stock)cart[i]=items[i].stock;
document.getElementById("q-"+i).innerText=cart[i];
updateTotal();}

function applyDiscount(){
let sub=0;for(let i in cart)sub+=cart[i]*items[i].price;
discount=discType.value==="percent"?sub*(discVal.value/100):Number(discVal.value||0);
updateTotal();}

function roundNoPennies(a){return Math.round(a*20)/20;}

function updateTotal(){
let taxable=0,non=0;
for(let i in cart){
(items[i].taxable?taxable:non)+=cart[i]*items[i].price;}
let sub=taxable+non-discount;if(sub<0)sub=0;
tax=taxable*TAX_RATE;
taxDisplay.innerText=tax.toFixed(2);
let t=roundNoPennies(sub+tax+Number(tip.value||0));
total.innerText=t.toFixed(2);}

function completeSale(){
let t=Number(total.innerText);
if(payType==="cash"&&cashGiven.value<t)return alert("Not enough cash");
if(payType==="split"&&(Number(cashPart.value)+Number(cardPart.value)!==t))
return alert("Split must equal total");

for(let i in cart){items[i].stock-=cart[i];}
taxLedger.push({date:new Date(),tax});
save();printReceipt();renderSales();}

function printReceipt(){
receipt.innerHTML="<h3>Bakery</h3>";
for(let i in cart)if(cart[i]>0)
receipt.innerHTML+=`${cart[i]} x ${i}<br>`;
receipt.innerHTML+=`<hr>Tax: $${tax.toFixed(2)}<br>
Total: $${total.innerText}<br>Thank you!`;
receipt.classList.remove("hidden");window.print();receipt.classList.add("hidden");}

function renderProduction(){
prodItem.innerHTML="";
for(let i in items)prodItem.innerHTML+=`<option>${i}</option>`;}

function addProduction(){
items[prodItem.value].stock+=Number(prodQty.value);
save();renderSales();}

function saveItem(){
items[itemName.value]={price:Number(itemPrice.value),
stock:Number(itemStock.value||0),taxable:itemTax.checked};
save();renderSales();}

function addEmployee(){employees[empPin.value]=empName.value;save();}
function addManager(){managers.push({name:mgrName.value,pin:mgrPin.value});save();}

function taxReport(){
let today=new Date().toDateString(),sum=0;
taxLedger.forEach(t=>{if(new Date(t.date).toDateString()===today)sum+=t.tax});
report.innerHTML=`<b>Tax Today:</b> $${sum.toFixed(2)}`;window.print();}
</script>

</body>
</html>
