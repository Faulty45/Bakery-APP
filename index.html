<!DOCTYPE html>
<html>
<head>
<title>Bakery POS</title>
<style>
body {
  font-family: "Segoe UI", sans-serif;
  background: #fff7ed;
  margin: 0;
  padding: 20px;
  color: #4b2e1e;
}

h2, h3, h4 { color: #8b4513; }

.card {
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

button {
  background: #d2691e;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover { background: #b45309; }

input, select {
  padding: 6px;
  margin: 5px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  width: 100%;
}

.hidden { display: none; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border-bottom: 1px solid #eee;
  padding: 8px;
}
</style>
</head>

<body>

<h2>🍞 Bakery POS</h2>

<div id="loginScreen" class="card">
  <input id="pinInput" type="password" placeholder="Enter PIN">
  <button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">

<h3 id="welcome"></h3>
<button onclick="logout()">Logout</button>

<!-- EMPLOYEE PANEL -->
<div id="employeePanel" class="card hidden">
  <h4>Sell Items</h4>
  <select id="itemSelect"></select>
  <button onclick="sellItem()">Sell</button>

  <h4>Add Produced Item</h4>
  <input id="prodName" placeholder="Item name">
  <input id="prodQty" type="number" placeholder="Quantity">
  <button onclick="addProduced()">Add Production</button>
</div>

<!-- MANAGER PANEL -->
<div id="managerPanel" class="card hidden">

<h3>Manager Dashboard</h3>

<h4>Manage Items & Prices</h4>
<input id="itemName" placeholder="Item name">
<input id="itemPrice" type="number" placeholder="Price">
<button onclick="addOrUpdateItem()">Save Item</button>

<table id="itemTable"></table>

<h4>Employee Management</h4>
<input id="empName" placeholder="Employee Name">
<input id="empPin" placeholder="4-digit PIN">
<button onclick="addEmployee()">Add Employee</button>

<h4>Add Manager</h4>
<input id="mgrPin" placeholder="4-digit Manager PIN">
<button onclick="addManager()">Add Manager</button>

<table id="employeeTable"></table>

<h4>Activity Logs</h4>
<button onclick="viewLogs()">View Logs</button>
<div id="logOutput"></div>

</div>
</div>

<script>
let managers = JSON.parse(localStorage.getItem("managers")) || ["0000"];
let employees = JSON.parse(localStorage.getItem("employees")) || {};
let items = JSON.parse(localStorage.getItem("items")) || {};
let activityLog = JSON.parse(localStorage.getItem("activityLog")) || [];
let failedAttempts = JSON.parse(localStorage.getItem("failedAttempts")) || {};

let currentUser = "";
let isManager = false;

function save() {
  localStorage.setItem("managers", JSON.stringify(managers));
  localStorage.setItem("employees", JSON.stringify(employees));
  localStorage.setItem("items", JSON.stringify(items));
  localStorage.setItem("activityLog", JSON.stringify(activityLog));
  localStorage.setItem("failedAttempts", JSON.stringify(failedAttempts));
}

function login() {
  const pin = pinInput.value;

  if (failedAttempts[pin] >= 3)
    return alert("Account locked");

  if (managers.includes(pin)) {
    currentUser = "Manager";
    isManager = true;
    openApp();
    return;
  }

  if (!employees[pin]) {
    failedAttempts[pin] = (failedAttempts[pin] || 0) + 1;
    save();
    return alert("Invalid PIN");
  }

  currentUser = employees[pin];
  isManager = false;
  openApp();
}

function openApp() {
  pinInput.value = "";
  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");
  welcome.innerText = "Welcome " + currentUser;

  employeePanel.classList.toggle("hidden", isManager);
  managerPanel.classList.toggle("hidden", !isManager);

  renderItems();
  renderEmployees();
  logAction("Logged in");
}

function logout() {
  logAction("Logged out");
  location.reload();
}

function renderItems() {
  itemSelect.innerHTML = "";
  itemTable.innerHTML = "<tr><th>Item</th><th>Price</th></tr>";

  for (let name in items) {
    itemSelect.innerHTML += `<option>${name}</option>`;
    itemTable.innerHTML += `
      <tr>
        <td>${name}</td>
        <td>
          ${isManager
            ? `<input value="${items[name]}" onchange="updatePrice('${name}', this.value)">`
            : "$" + items[name]}
        </td>
      </tr>`;
  }
}

function addOrUpdateItem() {
  items[itemName.value] = Number(itemPrice.value);
  save();
  renderItems();
  logAction("Updated item " + itemName.value);
  itemName.value = itemPrice.value = "";
}

function updatePrice(name, price) {
  items[name] = Number(price);
  save();
}

function sellItem() {
  logAction("Sold " + itemSelect.value);
  alert("Sold " + itemSelect.value);
}

function addProduced() {
  if (!items[prodName.value]) items[prodName.value] = 0;
  save();
  renderItems();
  logAction("Produced " + prodQty.value + " " + prodName.value);
  prodName.value = prodQty.value = "";
}

function addEmployee() {
  employees[empPin.value] = empName.value;
  save();
  renderEmployees();
  logAction("Added employee " + empName.value);
}

function addManager() {
  if (!managers.includes(mgrPin.value))
    managers.push(mgrPin.value);
  save();
  alert("Manager added");
  mgrPin.value = "";
}

  employeeTable.innerHTML =
